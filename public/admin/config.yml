# billysroom admin — edit gigs, mixes, exclusive parties and site info.
# Every "publish" saves a change to GitHub and the site rebuilds in about a minute.
backend:
  name: github
  repo: ammiecodes/billysroom
  branch: main
  commit_messages:
    create: 'add {{collection}}: {{slug}}'
    update: 'update {{collection}}: {{slug}}'
    delete: 'remove {{collection}}: {{slug}}'

site_url: https://billysroom.today
display_url: https://billysroom.today
logo:
  src: /favicon.svg
publish_mode: simple

media_folder: public/images/uploads
public_folder: /images/uploads
# every uploaded image is converted to web-friendly webp (max 2400px) so pages stay fast
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image: { format: webp, quality: 85, width: 2400, height: 2400 }

collections:
  - name: gigs
    label: gigs / dates
    label_singular: gig
    description: public gigs. they show as "upcoming" until the night is over, then move to "past dates" on their own.
    folder: src/content/gigs
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{venue}}'
    summary: '{{venue}} · {{city}} · {{date}}'
    sortable_fields: [date, venue, city]
    fields:
      - { name: venue, label: venue / event name, widget: string }
      - { name: city, label: city, widget: string }
      - { name: country, label: flag, widget: string, required: false, hint: 'e.g. 🇳🇬 🇰🇪 🇬🇭 🇨🇦' }
      - { name: date, label: date & start time, widget: datetime, input_timezone: Africa/Lagos, hint: 'pick the date and when your set or the night starts (lagos time).' }
      - { name: time_label, label: time to show, widget: string, required: false, hint: 'optional — e.g. "10pm" or "12am (late)". leave blank to use the start time.' }
      - { name: genres, label: genres, widget: string, required: false, hint: 'e.g. afro house, 3-step' }
      - { name: set_type, label: set type, widget: string, required: false, hint: 'e.g. b2b, b3b, opening set — leave blank for a solo set' }
      - { name: ticket_url, label: ticket link, widget: string, required: false }
      - { name: ticket_label, label: ticket button text, widget: string, required: false, default: 'get tickets 🎫' }
      - { name: flyer, label: flyer, widget: image, required: false }
      - { name: hidden, label: hide from site, widget: boolean, required: false, default: false }

  - name: drops
    label: billy’s room exclusive
    label_singular: party
    description: billy’s room parties. the next one shows big on /exclusive with the invite button; past ones become "past editions".
    folder: src/content/drops
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    summary: '{{title}} {{edition}} · {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: party name, widget: string, default: 'exclusive' }
      - { name: edition, label: edition, widget: string, required: false, hint: 'e.g. viii — shows on past editions' }
      - { name: date, label: date & doors time, widget: datetime, input_timezone: Africa/Lagos }
      - { name: city, label: city, widget: string, required: false, default: lagos }
      - { name: country, label: flag, widget: string, required: false, default: '🇳🇬' }
      - { name: venue, label: venue, widget: string, required: false, hint: 'e.g. private loft, secret location' }
      - { name: doors, label: doors open, widget: string, required: false, hint: 'e.g. 9pm' }
      - { name: lineup, label: djs, widget: list, required: false, hint: 'one dj per line' }
      - { name: flyer, label: flyer, widget: image, required: false }
      - { name: rsvp_url, label: rsvp / invite link, widget: string, required: false, hint: 'the link for this drop. leave blank to only collect roommate signups.' }
      - { name: rsvp_label, label: invite button text, widget: string, required: false, default: 'get an invite 🎟️' }
      - { name: sold_out, label: invites closed, widget: boolean, required: false, default: false }
      - { name: hidden, label: hide from site, widget: boolean, required: false, default: false }

  - name: releases
    label: releases
    label_singular: release
    description: your own music — singles, eps, albums. each gets its own page (billysroom.today/music/…). before release day it shows pre-save buttons and a countdown; on release day it switches to the streaming links by itself.
    folder: src/content/releases
    create: true
    slug: '{{title}}'
    summary: '{{title}} · {{type}} · {{release_date}}'
    sortable_fields: [release_date, title]
    fields:
      - { name: title, label: title, widget: string }
      - { name: type, label: type, widget: select, options: [single, ep, album], default: single }
      - { name: release_date, label: release date, widget: datetime, input_timezone: Africa/Lagos, hint: 'release day, 12am lagos time — the page flips from pre-save to listen at this moment.' }
      - { name: cover, label: cover art, widget: image, required: false, hint: 'square artwork' }
      - { name: description, label: short description, widget: text, required: false }
      - { name: artists, label: main artist(s), widget: string, default: billysroom }
      - { name: featured, label: featured artists, widget: list, required: false, hint: 'one per line' }
      - name: tracks
        label: tracklist (eps & albums)
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: track title, widget: string }
          - { name: featured, label: featuring, widget: string, required: false }
          - { name: duration, label: length, widget: string, required: false, hint: 'e.g. 6:42' }
      - { name: player_url, label: player link, widget: string, required: false, hint: 'optional. a soundcloud, youtube, spotify or apple music link to embed a player on the page.' }
      - { name: presave_url, label: pre-save smart link, widget: string, required: false, hint: 'optional. if a service gives you one pre-save link for all platforms, paste it here — it becomes the main pre-save button.' }
      - name: presave
        label: pre-save links (before release)
        widget: object
        collapsed: true
        required: false
        hint: 'per-platform pre-save / pre-add pages (e.g. spotify countdown page, apple music pre-add, audiomack pre-release). leave blank to hide.'
        fields:
          - { name: spotify, label: spotify, widget: string, required: false }
          - { name: apple_music, label: apple music, widget: string, required: false }
          - { name: youtube_music, label: youtube music, widget: string, required: false }
          - { name: audiomack, label: audiomack, widget: string, required: false }
          - { name: boomplay, label: boomplay, widget: string, required: false }
          - { name: soundcloud, label: soundcloud, widget: string, required: false }
          - { name: beatport, label: beatport, widget: string, required: false }
          - { name: bandcamp, label: bandcamp, widget: string, required: false }
          - { name: deezer, label: deezer, widget: string, required: false }
          - { name: tidal, label: tidal, widget: string, required: false }
          - { name: amazon_music, label: amazon music, widget: string, required: false }
      - name: links
        label: streaming links (from release day)
        widget: object
        collapsed: true
        required: false
        hint: 'only the ones you fill in show.'
        fields:
          - { name: spotify, label: spotify, widget: string, required: false }
          - { name: apple_music, label: apple music, widget: string, required: false }
          - { name: youtube_music, label: youtube music, widget: string, required: false }
          - { name: audiomack, label: audiomack, widget: string, required: false }
          - { name: boomplay, label: boomplay, widget: string, required: false }
          - { name: soundcloud, label: soundcloud, widget: string, required: false }
          - { name: beatport, label: beatport, widget: string, required: false }
          - { name: bandcamp, label: bandcamp, widget: string, required: false }
          - { name: deezer, label: deezer, widget: string, required: false }
          - { name: tidal, label: tidal, widget: string, required: false }
          - { name: amazon_music, label: amazon music, widget: string, required: false }
      - { name: dj_pack_url, label: dj pack link, widget: string, required: false, hint: 'google drive / dropbox / wetransfer link. free download, no sign-up.' }
      - { name: dj_pack_label, label: dj pack button text, widget: string, required: false, default: 'download dj pack' }
      - { name: dj_pack_note, label: what's in the pack, widget: string, required: false, hint: 'e.g. extended mix, radio edit, instrumental — wav + mp3' }
      - { name: label, label: label / credits line, widget: string, required: false }
      - { name: hidden, label: hide from site, widget: boolean, required: false, default: false }

  - name: mixes
    label: mixes & live sets
    label_singular: mix
    description: paste a soundcloud, youtube or mixcloud link — the player is made for you. youtube links show under "live sets" on /music.
    folder: src/content/mixes
    create: true
    slug: '{{title}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: title, widget: string, hint: 'e.g. session eleven: something' }
      - { name: url, label: link, widget: string, hint: 'soundcloud, youtube or mixcloud link' }
      - { name: date, label: date, widget: datetime, time_format: false, hint: 'newer mixes show first; mixes from the last 60 days get a "new" tag.' }
      - { name: description, label: one-line description, widget: string, required: false }
      - { name: hidden, label: hide from site, widget: boolean, required: false, default: false }

  - name: kolanut
    label: kolanut.fm
    label_singular: episode
    description: kolanut.fm episodes. paste the youtube link — they show under the "kolanut.fm" tab on /music. while there are none, the tab shows "coming soon".
    folder: src/content/kolanut
    create: true
    slug: 'episode-{{episode}}'
    summary: '{{episode}} · {{title}}'
    sortable_fields: [date, episode]
    fields:
      - { name: episode, label: episode number, widget: string, hint: 'season.episode — e.g. 1.01' }
      - { name: title, label: title, widget: string }
      - { name: guest, label: guest, widget: string, required: false }
      - { name: date, label: date aired, widget: datetime, time_format: false }
      - { name: url, label: youtube link, widget: string }
      - { name: description, label: one-line description, widget: string, required: false }
      - { name: hidden, label: hide from site, widget: boolean, required: false, default: false }

  - name: settings
    label: site info
    files:
      - name: site
        label: bio, links & contacts
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: name, widget: string }
          - { name: tagline, label: tagline (google & link previews), widget: string }
          - { name: based_in, label: based in, widget: string }
          - { name: bio_short, label: short bio, widget: text }
          - { name: bio_long, label: full bio (press page), widget: text }
          - { name: genres, label: genres, widget: list }
          - name: played_at
            label: played at (by country)
            widget: list
            fields:
              - { name: country, label: flag, widget: string, hint: 'e.g. 🇳🇬' }
              - { name: name, label: country name, widget: string }
              - { name: venues, label: venues / events, widget: list }
          - { name: booking_email, label: booking email, widget: string }
          - { name: demo_email, label: demos email, widget: string }
          - { name: instagram, label: instagram link, widget: string }
          - { name: soundcloud, label: soundcloud link, widget: string }
          - { name: youtube, label: youtube link, widget: string, required: false }
          - { name: x, label: x link, widget: string, required: false }
          - { name: kolanut_intro, label: kolanut.fm intro, widget: text }
          - { name: kolanut_instagram, label: kolanut.fm instagram link, widget: string, required: false }
          - { name: kit_form_id, label: kit form id, widget: string, hint: 'the number in your kit form link' }
          - { name: newsletter_url, label: newsletter page, widget: string }
          - { name: press_kit_url, label: notion press kit, widget: string, required: false }
          - { name: press_photos_url, label: hi-res photos folder link, widget: string, required: false }
          - { name: press_photos, label: press photos, widget: list, field: { name: photo, label: photo, widget: image }, required: false }
          - { name: rider_file, label: tech rider (pdf), widget: file, required: false }
          - { name: logo_home, label: logo — home, widget: image, required: false, hint: 'svg or transparent png' }
          - { name: logo_sessions, label: logo — music, widget: image, required: false }
          - { name: logo_exclusive, label: logo — exclusive, widget: image, required: false }
          - { name: logo_press, label: logo — press & booking, widget: image, required: false }
          - { name: hero_image, label: home page photo, widget: image, required: false, hint: 'fills the whole home page unless you add a second photo below' }
          - { name: home_sections_image, label: home page photo — scroll sections, widget: image, required: false, hint: 'optional. a different photo behind latest mix, dates, billy’s room, about and roommates.' }
          - { name: sessions_image, label: music page photo, widget: image, required: false }
          - { name: dates_image, label: dates page photo, widget: image, required: false }
          - { name: exclusive_image, label: exclusive page background, widget: image, required: false }
          - { name: press_image, label: press page photo, widget: image, required: false }
